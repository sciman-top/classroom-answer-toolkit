name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"

      - name: Restore and verify development workspace
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/setup-development.ps1 -NoInstall

      - name: Verify workflow and packaging contracts
        shell: pwsh
        run: |
          dotnet test tests/ClassroomToolkit.Tests/ClassroomToolkit.Tests.csproj -c Debug --no-build --filter "Gate=ToolchainIntegration"

      - name: Build release packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1 `
            -Version $version `
            -WorkspaceContract "1" `
            -Audience developer-operator-preview

      - name: Generate release SBOM
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          dotnet tool install --tool-path artifacts/work/tools Microsoft.Sbom.DotNetTool --version 4.1.5
          artifacts/work/tools/sbom-tool generate `
            -b artifacts/deliveries/$version `
            -bc . `
            -pn ClassroomToolkit `
            -pv $version `
            -ps sciman-top `
            -nsb "https://github.com/sciman-top/classroom-answer-toolkit/releases/download/v$version/" `
            -nsu "ClassroomToolkit-$version" `
            -pm true `
            -D true

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/deliveries/*/ClassroomToolkit-*-win-x64.zip
            artifacts/deliveries/*/ClassroomToolkit-*-source.zip
            artifacts/deliveries/*/update-manifest.json
            artifacts/deliveries/*/_manifest/spdx_2.2/manifest.spdx.json
            scripts/install-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          gh release create $env:RELEASE_TAG `
            "artifacts/deliveries/$version/ClassroomToolkit-$version-win-x64.zip" `
            "artifacts/deliveries/$version/ClassroomToolkit-$version-source.zip" `
            "artifacts/deliveries/$version/update-manifest.json" `
            "artifacts/deliveries/$version/_manifest/spdx_2.2/manifest.spdx.json" `
            "scripts/install-release.ps1" `
            --title "ClassroomToolkit $version developer/operator preview" `
            --generate-notes `
            --verify-tag
