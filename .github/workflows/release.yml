name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Restore and verify development workspace
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/setup-development.ps1 -NoInstall

      - name: Build release packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1 -Version $version -WorkspaceContract "1"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          gh release create $env:RELEASE_TAG `
            "artifacts/release/ClassroomToolkit-$version-win-x64.zip" `
            "artifacts/release/ClassroomToolkit-$version-source.zip" `
            "artifacts/release/update-manifest.json" `
            "scripts/install-release.ps1" `
            --generate-notes `
            --verify-tag
