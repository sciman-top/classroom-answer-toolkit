name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"

      - name: Bootstrap workspace and run Core gate with health eval
        shell: pwsh
        run: |
          # -SkipTests: the contract step below runs both xUnit filters; letting
          # setup also run them executed the ordinary suite twice per push.
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/setup-development.ps1 -NoInstall -SkipTests

      - name: Verify gateway, renderer, and workflow contracts
        shell: pwsh
        run: |
          npm --prefix tools/ai-gateway run test:answer
          npm --prefix tools/latex-renderer run test:render
          npm --prefix tools/latex-renderer run test:output-path
          npm --prefix tools/latex-renderer run test:eval-runtime
          npm --prefix tools/latex-renderer run test:visual
          npm --prefix tools/rule-compiler run test:rules
          npm --prefix tools/spec-assembler run test:assemble
          npm --prefix eval/real-paper test
          dotnet test tests/ClassroomToolkit.Tests/ClassroomToolkit.Tests.csproj -c Debug --no-build --filter "Gate!=ToolchainIntegration"
          dotnet test tests/ClassroomToolkit.Tests/ClassroomToolkit.Tests.csproj -c Debug --no-build --filter "Gate=ToolchainIntegration"

      # Evidence collection must sit after the steps that produce it: a failure()
      # step never fires retroactively for a later failure, so the upload used
      # to be skipped for exactly the verification failures it exists to
      # diagnose (eval writes .eval-work; test:visual is the environment-coupled
      # browser/CJK-font case).
      - name: Upload rendered pages when a gate fails
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: eval-work
          path: .eval-work/**
          # The work root is dot-prefixed and upload-artifact skips hidden files
          # by default, which silently produced an empty artifact.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
